name: Exact finite verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Install exact verification dependencies
        run: python -m pip install -r requirements-verification.txt
      - name: Verify the complete finite chain
        run: python src/verify_project.py
      - name: Check independent foundation identities
        run: python -S src/verify_foundation_identities.py
      - name: Check independent stability inputs
        run: python -S src/verify_stability_inputs.py
      - name: Check all offset polynomials independently
        run: python -S src/verify_offset_polynomials.py
      - name: Audit equality spans independently
        run: python src/audit_equality_spans.py
      - name: Confirm rejection of malformed witnesses
        run: python src/verify_rejection_cases.py
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            results/verification_manifest.json
            audit/*.json


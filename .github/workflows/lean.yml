name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Install export dependency
        run: python -m pip install numpy==2.3.5
      - name: Confirm generated Lean inputs match exact certificates
        run: python scripts/export_lean_certificate.py --check
      - name: Build and independently recheck the Lean environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: InducedPentagons
      - name: Audit transitive axioms and reject corrupted inputs
        run: python scripts/verify_lean.py --skip-build
      - name: Upload Lean verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-certificate-verification
          path: results/lean_verification.json
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
      MATHLIB_CACHE_GET_URL: ""
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the pinned mathematical proof toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/paper
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch only imported Mathlib dependencies
        run: python scripts/fetch_mathlib_cache.py
      - name: Build Mathlib-based mathematical proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/paper
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: true
          axiom-audit-root: InducedPentagonsPaper
      - name: Audit mathematical declarations
        run: python scripts/verify_lean_paper.py --skip-build
      - name: Upload mathematical proof verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-paper-verification
          path: results/lean_paper_verification.json
